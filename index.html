<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Track your expenses and manage your budget.</p>
    </header>

    <main>
        <section class="dashboard">
            <div class="card">
                <h3>Budget</h3>
                <p id="budget">$0.00</p>
            </div>

            <div class="card">
                <h3>Total Spent</h3>
                <p id="totalSpent">$0.00</p>
            </div>

            <div class="card">
                <h3>Remaining</h3>
                <p id="remaining">$0.00</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Set Your Budget</h2>

            <form id="budgetForm">
                <input
                    type="number"
                    id="budgetInput"
                    placeholder="Enter budget"
                    min="0"
                    step="0.01"
                    required
                >
                <button type="submit">Set Budget</button>
            </form>
        </section>

        <section class="form-section">
            <h2>Add an Expense</h2>

            <form id="expenseForm">
                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                    required
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount"
                    min="0"
                    step="0.01"
                    required
                >

                <select id="expenseCategory" required>
                    <option value="">Choose category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="feedback">
            <h2>Budget Status</h2>
            <p id="message">Set a budget to get started.</p>
        </section>

        <section>
            <h2>Expense History</h2>

            <ul id="expenseList">
                <!-- Expenses will be added here with JavaScript -->
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
